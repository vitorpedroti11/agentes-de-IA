<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Painel de Conteúdo</title>
<meta name="theme-color" content="#16151a">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f5f3ef; --surface:#ffffff; --surface-2:#f0ede7; --line:#e2ddd3; --ink:#16151a; --ink-2:#55525c; --ink-3:#8c8894;
  --accent:#ff5a1f; --accent-ink:#ffffff; --accent-soft:#ffe6db;
  --a:#16a34a; --a-soft:#dcf5e3; --b:#d97706; --b-soft:#fdf0d5; --c:#6b7280; --c-soft:#eceef1;
  --p:#7c3aed; --p-soft:#ede4fd;
  --bad:#dc2626; --bad-soft:#fde4e4; --ok:#16a34a;
  --shadow:0 1px 2px rgba(20,18,30,.05),0 6px 24px -12px rgba(20,18,30,.18);
  --radius:14px; --mono:"JetBrains Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0f0f13; --surface:#18181e; --surface-2:#202028; --line:#2c2c36; --ink:#f2f0ec; --ink-2:#b4b1bb; --ink-3:#7c7985;
    --accent:#ff6a33; --accent-soft:#3a1d12; --a-soft:#10301b; --b-soft:#35270c; --c-soft:#26272d; --p-soft:#2a1f42; --bad-soft:#3a1515;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 28px -14px rgba(0,0,0,.7);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0f0f13; --surface:#18181e; --surface-2:#202028; --line:#2c2c36; --ink:#f2f0ec; --ink-2:#b4b1bb; --ink-3:#7c7985;
  --accent:#ff6a33; --accent-soft:#3a1d12; --a-soft:#10301b; --b-soft:#35270c; --c-soft:#26272d; --p-soft:#2a1f42; --bad-soft:#3a1515;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 28px -14px rgba(0,0,0,.7);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.5 "Inter Tight",system-ui,-apple-system,Segoe UI,sans-serif;-webkit-font-smoothing:antialiased}
a{color:inherit}
button,select,input,textarea{font:inherit;color:inherit}
.wrap{max-width:1180px;margin:0 auto;padding:0 16px}
h1,h2,h3,h4{text-wrap:balance}

header.top{padding:20px 0 14px;border-bottom:1px solid var(--line);background:var(--surface);position:sticky;top:0;z-index:6}
.top-inner{padding-top:env(safe-area-inset-top,0px)}
.top-row{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;letter-spacing:-.01em;font-size:16px}
.brand .dot{width:26px;height:26px;border-radius:8px;background:var(--accent);display:grid;place-items:center;color:var(--accent-ink);font-weight:800;font-size:14px;flex:none}
.top-actions{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 12px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;font-size:14px;font-weight:500;text-decoration:none;white-space:nowrap;min-height:38px}
.btn:hover{border-color:var(--ink-3)}
.btn:focus-visible,.chip:focus-visible,.tab:focus-visible,.navtab:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--bad);border-color:var(--bad-soft)}
.btn.small{padding:5px 9px;font-size:13px;min-height:32px}
.btn[disabled]{opacity:.45;cursor:not-allowed}

.cliente-bar{display:flex;gap:8px;align-items:center;margin-top:12px;flex-wrap:wrap}
.cliente-bar select{flex:1 1 240px;min-width:0;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 10px;font-size:15px;min-height:42px}
.badge-demo{background:var(--b-soft);color:var(--b);border-radius:999px;padding:2px 9px;font-size:12px;font-weight:600}
.badge-local{background:var(--p-soft);color:var(--p);border-radius:999px;padding:2px 9px;font-size:12px;font-weight:600}

nav.tabs{display:flex;gap:4px;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;margin-top:12px;padding-bottom:2px}
nav.tabs::-webkit-scrollbar{display:none}
.navtab{flex:none;border:0;background:transparent;border-radius:10px 10px 0 0;padding:9px 14px;font-size:14px;font-weight:600;color:var(--ink-2);cursor:pointer;border-bottom:2px solid transparent}
.navtab[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent)}

main{padding:18px 0 60px}
.view{display:none}
.view.active{display:block}
.hint{background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:10px 14px;font-size:13px;color:var(--ink-2);margin-bottom:16px;display:flex;gap:8px;align-items:flex-start}
.hint b{color:var(--ink)}

.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:18px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;box-shadow:var(--shadow)}
.kpi .v{font-size:26px;font-weight:800;letter-spacing:-.02em;line-height:1.1;font-variant-numeric:tabular-nums}
.kpi .l{color:var(--ink-2);font-size:13px}
.kpi.accent .v{color:var(--accent)}

.grid-clientes{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.card-cliente{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px;box-shadow:var(--shadow);cursor:pointer;text-align:left}
.card-cliente h4{margin:0 0 4px;font-size:15px}
.card-cliente .seg{color:var(--ink-2);font-size:13px;margin-bottom:10px}
.card-cliente .stats{display:flex;gap:10px;flex-wrap:wrap;font-size:12px;color:var(--ink-3)}
.card-cliente .stats b{color:var(--ink);font-variant-numeric:tabular-nums}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow);margin-bottom:16px}
.panel h3{margin:0 0 12px;font-size:15px;letter-spacing:-.01em;display:flex;align-items:center;gap:8px}
.panel h4{margin:0 0 8px;font-size:12px;text-transform:uppercase;letter-spacing:.07em;color:var(--ink-3);font-weight:700}
.field{margin-bottom:12px}
.field label{display:block;font-size:13px;font-weight:600;margin-bottom:5px;color:var(--ink-2)}
.field input,.field textarea,.field select{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 11px;font-size:16px;min-height:42px}
.field textarea{min-height:70px;resize:vertical;font-size:15px}
.field .sub{font-size:12px;color:var(--ink-3);margin-top:4px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
@media (max-width:640px){.row2,.row3{grid-template-columns:1fr}}

.filters-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.filters-row select,.filters-row input[type="search"]{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 10px;font-size:15px;min-height:40px}
.filters-row input[type="search"]{flex:1 1 200px;min-width:0}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13px;cursor:pointer;min-height:34px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}

.tag{font-size:12px;padding:2px 8px;border-radius:999px;background:var(--surface-2);color:var(--ink-2);border:1px solid var(--line);white-space:nowrap;display:inline-block}
.tag.tipo{background:var(--accent-soft);color:var(--accent);border-color:transparent;font-weight:600}
.tag.pilar{background:var(--p-soft);color:var(--p);border-color:transparent}
.tag.st-ideia{background:var(--c-soft);color:var(--c);border-color:transparent}
.tag.st-aprovado{background:var(--b-soft);color:var(--b);border-color:transparent;font-weight:600}
.tag.st-desenvolvido{background:var(--a-soft);color:var(--a);border-color:transparent;font-weight:600}
.tag.st-publicado{background:var(--a);color:#fff;border-color:transparent;font-weight:600}
.tag.st-descartado{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.tag.warn{background:var(--bad-soft);color:var(--bad);border-color:transparent;font-weight:600}

.item-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);margin-bottom:10px;box-shadow:var(--shadow);overflow:hidden}
.item-head{display:flex;gap:10px;align-items:flex-start;justify-content:space-between;padding:13px 14px;cursor:pointer}
.item-head:hover{background:var(--surface-2)}
.item-head .titulo{font-weight:700;font-size:15px;margin:0 0 6px}
.item-tags{display:flex;gap:6px;flex-wrap:wrap}
.item-body{display:none;border-top:1px solid var(--line);padding:14px}
.item-card[open] .item-body{display:block}
.chev{transition:transform .2s;color:var(--ink-3);flex:none}
.item-card[open] .chev{transform:rotate(180deg)}
.campo-bloco{background:var(--surface-2);border-radius:10px;padding:11px 13px;margin-bottom:10px}
.campo-bloco .top{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:5px}
.campo-bloco .rotulo{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-3);font-weight:700}
.campo-bloco .valor{font-size:14px;white-space:pre-wrap}
.campo-bloco .valor.vazio{color:var(--ink-3);font-style:italic}
.campo-acoes{display:flex;gap:6px}
.cena-lista{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.cena-lista li{background:var(--surface);border:1px dashed var(--line);border-radius:8px;padding:8px 10px}
.cena-lista .num{font-family:var(--mono);font-size:12px;color:var(--ink-3)}
.item-actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px;padding-top:10px;border-top:1px solid var(--line)}
.item-actions select{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 8px;font-size:13px;min-height:34px}

.dia-grupo{margin-bottom:14px}
.dia-titulo{font-weight:700;font-size:14px;text-transform:capitalize;margin:0 0 8px;color:var(--ink-2);display:flex;align-items:center;gap:8px}
.dia-titulo .n{font-family:var(--mono);color:var(--ink-3);font-weight:400}
.semana-item{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 13px;margin-bottom:8px;box-shadow:var(--shadow)}
.semana-item .ideia{font-size:14px;margin:6px 0}
.semana-item .cta{font-size:13px;color:var(--ink-2)}
.semana-item .acoes{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}

.mes-linha{display:grid;grid-template-columns:74px 1fr auto;gap:10px;align-items:flex-start;padding:11px 0;border-top:1px dashed var(--line)}
.mes-linha:first-child{border-top:0}
.mes-linha .data{font-family:var(--mono);font-size:13px;color:var(--ink-2);padding-top:3px}
.mes-linha .conteudo{min-width:0}
.mes-linha .tema{font-weight:600;font-size:14px;margin:2px 0}
.mes-linha .meta{font-size:13px;color:var(--ink-2)}

.ideia-card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 13px;margin-bottom:8px;box-shadow:var(--shadow)}
.ideia-card.usada{opacity:.6}
.ideia-card .texto{font-size:14px;margin:6px 0}
.ideia-card .acoes{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:6px}
.ideia-card label.usar{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--ink-2);cursor:pointer}

.hist-linha{display:grid;grid-template-columns:88px auto 1fr auto;gap:10px;align-items:center;padding:10px 0;border-top:1px dashed var(--line);font-size:13px}
.hist-linha:first-child{border-top:0}
.hist-linha .data{font-family:var(--mono);color:var(--ink-3)}
.hist-linha .tit{font-weight:600;min-width:0;overflow-wrap:anywhere}
@media (max-width:640px){.hist-linha{grid-template-columns:1fr;gap:4px}}

.compositor{background:var(--surface-2);border-radius:12px;padding:14px}
.contador{display:flex;align-items:center;gap:8px}
.contador button{width:34px;height:34px;border-radius:8px;border:1px solid var(--line);background:var(--surface);font-size:16px;cursor:pointer}
.contador input{width:52px;text-align:center;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px;font-size:15px;min-height:34px}

.empty{padding:34px 16px;text-align:center;color:var(--ink-3);font-size:14px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);opacity:0;background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:10px;font-size:14px;transition:.2s;pointer-events:none;z-index:30;max-width:90vw;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

@media (prefers-reduced-motion:reduce){*{transition:none!important}}
@media (max-width:560px){
  .top-row{gap:8px}
  .brand{font-size:15px}
  .top-actions .btn{min-height:38px;padding:7px 10px}
  .kpis{grid-template-columns:repeat(2,1fr)}
  .row3{grid-template-columns:1fr}
  .mes-linha{grid-template-columns:56px 1fr}
  .mes-linha .acoes{grid-column:1/-1}
}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="top-inner">
    <div class="top-row">
      <div class="brand"><div class="dot">A</div>Adspot · Conteúdo</div>
      <div class="top-actions">
        <button class="btn" id="btnRecarregar" title="Descartar edições locais e voltar aos dados do repositório">↺ Recarregar</button>
        <button class="btn" id="btnTema" aria-label="Alternar tema">◐ Tema</button>
      </div>
    </div>
    <div class="cliente-bar">
      <select id="selCliente" aria-label="Cliente selecionado"></select>
      <button class="btn primary" id="btnNovoCliente">+ Novo cliente</button>
    </div>
    <nav class="tabs" id="tabsNav" role="tablist"></nav>
    </div>
  </header>

  <main>
    <section class="view" data-view="dashboard"><div id="viewDashboard"></div></section>
    <section class="view" data-view="clientes"><div id="viewClientes"></div></section>
    <section class="view" data-view="criar"><div id="viewCriar"></div></section>
    <section class="view" data-view="semana"><div id="viewSemana"></div></section>
    <section class="view" data-view="mensal"><div id="viewMensal"></div></section>
    <section class="view" data-view="ideias"><div id="viewIdeias"></div></section>
    <section class="view" data-view="historico"><div id="viewHistorico"></div></section>
  </main>
</div>

<script>

function copiar(texto, msg){
  msg = msg || "Copiado";

}

function carregarEstado(){
  var estado;
  try { estado = JSON.parse(localStorage.getItem(LS_KEY) || "null"); } catch(e){ estado = null; }
  if (!estado || !estado.clientes) estado = { clientes:{} };
  // semeia clientes do repositório que ainda não existem localmente
  (SEED.clientes||[]).forEach(function(c){
    var id = c.cliente && c.cliente.id;
    if (!id) return;
    if (!estado.clientes[id]) { estado.clientes[id] = clone(c); return; }
    // uni por id os itens novos que vieram do repositório (não sobrescreve edição local)
    ["conteudos","semanas","planejamento_mensal","banco_ideias"].forEach(function(colecao){
      var locais = estado.clientes[id][colecao] || (estado.clientes[id][colecao]=[]);
      var idsLocais = {}; locais.forEach(function(x){ idsLocais[x.id]=true; });
      (c[colecao]||[]).forEach(function(x){ if(!idsLocais[x.id]) locais.push(clone(x)); });
    });
  });
  return estado;
}
function salvarEstado(){ try{ localStorage.setItem(LS_KEY, JSON.stringify(STATE)); }catch(e){} }
function carregarUI(){ try{ return JSON.parse(localStorage.getItem(LS_UI) || "{}"); }catch(e){ return {}; } }
function salvarUI(){ try{ localStorage.setItem(LS_UI, JSON.stringify(UI)); }catch(e){} }

var STATE = carregarEstado();

function listaClientes(){ return Object.keys(STATE.clientes).map(function(id){ return STATE.clientes[id]; })

function clienteAtual(){ return STATE.clientes[UI.clienteId] || listaClientes()[0] || null; }
function selecionarCliente(id){ UI.clienteId = id; salvarUI(); renderTudo(); }

document.getElementById("btnRecarregar").onclick = function(){
  if (!confirm2(this, "Descartar edições locais e recarregar do repositório?")) return;
  localStorage.removeItem(LS_KEY);

  toast("Dados recarregados do repositório");

// confirmação em duas etapas, sem usar confirm() do navegador
function confirm2(btn, msg){
  if (btn.dataset.confirmando === "1"){ btn.dataset.confirmando=""; btn.textContent = btn.dataset.textoOriginal || btn.textContent; return true; }
  btn.dataset.textoOriginal = btn.dataset.textoOriginal || btn.textContent;
  btn.dataset.confirmando = "1"; btn.textContent = "Confirma?";
  toast(msg);
  setTimeout(function(){ if(btn.dataset.confirmando==="1"){ btn.dataset.confirmando=""; btn.textContent = btn.dataset.textoOriginal; } }, 3000);
  return false;
}

function mostrarAba(id){
  document.querySelectorAll(".navtab").forEach(function(b){ b.setAttribute("aria-selected", String(b.dataset.view===id)); });

function renderSelectCliente(){
  var sel = document.getElementById("selCliente");

function contadoresCliente(c){
  var cont = {ideia:0,aprovado:0,desenvolvido:0,publicado:0,descartado:0};
  (c.conteudos||[]).forEach(function(i){ if(cont[i.status]!=null) cont[i.status]++; });
  var semanasPendentes = (c.semanas||[]).filter(function(s){ return s.status!=="desenvolvido"; }).length;
  var ideiasLivres = (c.banco_ideias||[]).filter(function(i){ return !i.usada; }).length;
  var ultima = "";
  (c.conteudos||[]).forEach(function(i){ if(i.data_criacao && i.data_criacao>ultima) ultima=i.data_criacao; });
  return {cont:cont, semanasPendentes:semanasPendentes, ideiasLivres:ideiasLivres, ultima:ultima};

function tagTipo(t){ return '<span class="tag tipo">'+esc(TIPOS[t]||t)+'</span>'; }

function campoBloco(rotulo, valor, onRegenerar){
  var vazio = !valor;
  return '<div class="campo-bloco"><div class="top"><span class="rotulo">'+esc(rotulo)+'</span>'
    + '<span class="campo-acoes">'
    + (valor ? '<button class="btn small" data-copiar="'+esc(rotulo)+'">Copiar</button>' : '')

    + '</span></div>'
    + '<div class="valor'+(vazio?' vazio':'')+'">'+esc(valor || "ainda não desenvolvido")+'</div></div>';
}

    h += campoBloco("Legenda", p.legenda, true);
    h += campoBloco("CTA", p.cta, true);
  } else if (t === "carrossel" && item.carrossel){
    var cc = item.carrossel;
    h += '<div class="campo-bloco"><div class="top"><span class="rotulo">Slides</span></div>'
      + (cc.slides && cc.slides.length ? '<ul class="cena-lista">' + cc.slides.map(function(s){
          return '<li><span class="num">Slide '+esc(s.numero)+'</span><div>'+esc(s.conteudo||"—")+'</div>'
            + (s.direcionamento_visual ? '<div class="sub" style="color:var(--ink-3);font-size:12px;margin-top:3px">🎨 '+esc(s.direcionamento_visual)+'</div>' : '')
          + '</li>';
        }).join("") + '</ul>' : '<div class="valor vazio">ainda não desenvolvido</div>')
      + '</div>';
    h += campoBloco("CTA", cc.cta, true);
    h += campoBloco("Legenda", cc.legenda, true);
  } else if (t === "reel" && item.reel){
    var r = item.reel;
    h += campoBloco("Gancho", r.gancho, true);
    h += '<div class="campo-bloco"><div class="top"><span class="rotulo">Roteiro (cena · visual · fala · texto na tela)</span></div>'
      + (r.roteiro && r.roteiro.length ? '<ul class="cena-lista">' + r.roteiro.map(function(c){
          return '<li><span class="num">Cena '+esc(c.cena)+'</span>'
            + '<div><b>Visual:</b> '+esc(c.visual||"—")+'</div>'
            + (c.fala ? '<div><b>Fala:</b> '+esc(c.fala)+'</div>' : '')
            + (c.texto_tela ? '<div><b>Texto na tela:</b> '+esc(c.texto_tela)+'</div>' : '')
          + '</li>';
        }).join("") + '</ul>' : '<div class="valor vazio">ainda não desenvolvido</div>')
      + '</div>';
    h += campoBloco("CTA", r.cta, true);
    h += campoBloco("Legenda", r.legenda, true);
  } else if (t === "stories" && item.stories){
    var seq = item.stories.sequencia || [];
    h += '<div class="campo-bloco"><div class="top"><span class="rotulo">Sequência de stories</span></div>'
      + (seq.length ? '<ul class="cena-lista">' + seq.map(function(s){
          return '<li><span class="num">Story '+esc(s.numero)+'</span>'
            + (s.objetivo ? '<div><b>Objetivo:</b> '+esc(s.objetivo)+'</div>' : '')
            + '<div>'+esc(s.conteudo||"—")+'</div>'
            + (s.cta ? '<div><b>CTA:</b> '+esc(s.cta)+'</div>' : '')
          + '</li>';
        }).join("") + '</ul>' : '<div class="valor vazio">ainda não desenvolvido</div>')
      + '</div>';
  } else if (t === "legenda" && item.legenda){
    h += campoBloco("Texto", item.legenda.texto, true);
  } else if (t === "roteiro" && item.roteiro){
    var cenas = item.roteiro.cenas || [];
    h += '<div class="campo-bloco"><div class="top"><span class="rotulo">Cenas</span></div>'
      + (cenas.length ? '<ul class="cena-lista">' + cenas.map(function(c){
          return '<li><span class="num">Cena '+esc(c.numero)+'</span>'
            + '<div><b>Visual:</b> '+esc(c.visual||"—")+'</div>'
            + (c.fala ? '<div><b>Fala:</b> '+esc(c.fala)+'</div>' : '')
            + (c.texto_tela ? '<div><b>Texto na tela:</b> '+esc(c.texto_tela)+'</div>' : '')
          + '</li>';
        }).join("") + '</ul>' : '<div class="valor vazio">ainda não desenvolvido</div>')
      + '</div>';
  } else {
    h += '<div class="valor vazio">ainda não desenvolvido — use "Desenvolver com o agente" abaixo</div>';
  }
  return h;
}

function textoCampoParaCopiar(item, rotulo){
  var t = item.tipo, r = rotulo.toLowerCase();
  var mapas = {
    post: item.post, carrossel: item.carrossel, reel: item.reel, legenda: item.legenda, roteiro: item.roteiro
  };
  var obj = mapas[t] || {};
  if (r.indexOf("título")>=0) return obj.titulo || "";
  if (r.indexOf("texto da arte")>=0) return obj.texto_arte || "";
  if (r.indexOf("direcionamento")>=0) return obj.direcionamento_visual || "";
  if (r.indexOf("legenda")>=0) return obj.legenda || (item.legenda && item.legenda.texto) || "";
  if (r.indexOf("cta")>=0) return obj.cta || "";
  if (r.indexOf("gancho")>=0) return obj.gancho || "";
  if (r === "texto") return (item.legenda && item.legenda.texto) || "";
  return "";
}

        + '<select data-status>'+Object.keys(STATUS).map(function(s){return '<option value="'+s+'"'+(s===item.status?' selected':'')+'>'+STATUS[s]+'</option>';}).join("")+'</select></label>'

  el.querySelectorAll("[data-copiar]").forEach(function(b){
    b.onclick = function(e){ e.stopPropagation(); copiar(textoCampoParaCopiar(item, b.dataset.copiar), esc(b.dataset.copiar)+" copiado"); };
  });
  el.querySelectorAll("[data-regenerar]").forEach(function(b){
    b.onclick = function(e){ e.stopPropagation();
      comando('No conteúdo "'+item.titulo+'" ('+(TIPOS[item.tipo]||item.tipo)+', id '+item.id+') do cliente '+cliente.cliente.nome
        +', regenere só o campo "'+b.dataset.regenerar+'". Mantenha todo o resto do conteúdo exatamente como está.');
    };
  });
  var selStatus = el.querySelector("[data-status]");
  selStatus.onclick = function(e){ e.stopPropagation(); };
  selStatus.onchange = function(){ item.status = selStatus.value; salvarEstado(); renderCriar(); renderDashboard(); };
  var btnGerar = el.querySelector("[data-gerar]");
  btnGerar.onclick = function(e){ e.stopPropagation();
    comando('Desenvolva o conteúdo "'+item.titulo+'" ('+(TIPOS[item.tipo]||item.tipo)+', pilar '+(PILARES[item.pilar]||item.pilar||"—")
      +') do cliente '+cliente.cliente.nome+'. Preencha todos os campos desse formato seguindo o tom de voz cadastrado.');
  };
  var btnDesc = el.querySelector("[data-descartar]");
  btnDesc.onclick = function(e){ e.stopPropagation();
    if (!confirm2(btnDesc, "Toque de novo para descartar")) return;
    item.status = "descartado"; salvarEstado(); renderCriar();
  };
  return el;
}

function campoTexto(id, rotulo, valor, tipo, sub){
  var tag = tipo==="textarea" ? "textarea" : "input";
  var attrs = tipo==="textarea" ? "" : ' type="text"';
  return '<div class="field"><label for="'+id+'">'+esc(rotulo)+'</label>'
    + '<'+tag+attrs+' id="'+id+'">'+(tipo==="textarea"?esc(valor||""):"")+'</'+tag+'>'
    + (tipo!=="textarea" ? '' : '')
    + (sub ? '<div class="sub">'+esc(sub)+'</div>' : '')
    + '</div>';
}
function formularioCliente(cliente){
  var c = cliente.cliente;
  var html = '<div class="row2">'
    + campoTexto("fNome","Nome da empresa", c.nome, "text")
    + campoTexto("fSegmento","Segmento", c.segmento, "text")
    + '</div>'
    + campoTexto("fProdutos","Produtos e serviços", c.produtos_servicos, "textarea")
    + campoTexto("fPublico","Público-alvo", c.publico_alvo, "textarea")
    + campoTexto("fDiferenciais","Diferenciais", c.diferenciais, "textarea")
    + campoTexto("fObjetivos","Objetivos (o que a conta quer alcançar)", c.objetivos, "textarea")
    + campoTexto("fTom","Tom de voz", c.tom_de_voz, "textarea")
    + campoTexto("fVisual","Identidade visual", c.identidade_visual, "textarea")
    + '<div class="row2">'
      + campoTexto("fUsar","Palavras que devem ser usadas", (c.palavras_usar||[]).join(", "), "text", "separe por vírgula")
      + campoTexto("fEvitar","Palavras que devem ser evitadas", (c.palavras_evitar||[]).join(", "), "text", "separe por vírgula")
    + '</div>'
    + campoTexto("fInfo","Informações importantes da marca", c.informacoes_importantes, "textarea");
  // preenche os inputs de texto (não-textarea) via valor depois, pra evitar escapar valor com aspas dentro do atributo
  return html;
}
function preencherFormulario(cliente){
  var c = cliente.cliente;
  document.getElementById("fNome").value = c.nome||"";
  document.getElementById("fSegmento").value = c.segmento||"";
  document.getElementById("fUsar").value = (c.palavras_usar||[]).join(", ");
  document.getElementById("fEvitar").value = (c.palavras_evitar||[]).join(", ");
}
function lerFormulario(idExistente){
  var slug = idExistente && idExistente!=="__novo__" ? idExistente :
    (document.getElementById("fNome").value||"cliente").toLowerCase()
      .normalize("NFD").replace(/[̀-ͯ]/g,"")
      .replace(/[^a-z0-9]+/g,"-").replace(/(^-|-$)/g,"") || uid("cliente");
  return {
    id: slug,
    nome: document.getElementById("fNome").value.trim(),
    segmento: document.getElementById("fSegmento").value.trim(),
    produtos_servicos: document.getElementById("fProdutos").value.trim(),
    publico_alvo: document.getElementById("fPublico").value.trim(),
    diferenciais: document.getElementById("fDiferenciais").value.trim(),
    objetivos: document.getElementById("fObjetivos").value.trim(),
    tom_de_voz: document.getElementById("fTom").value.trim(),
    identidade_visual: document.getElementById("fVisual").value.trim(),
    palavras_usar: document.getElementById("fUsar").value.split(",").map(function(s){return s.trim();}).filter(Boolean),
    palavras_evitar: document.getElementById("fEvitar").value.split(",").map(function(s){return s.trim();}).filter(Boolean),
    informacoes_importantes: document.getElementById("fInfo").value.trim(),
  };
}
function jsonClienteParaAgente(c){
  return JSON.stringify({cliente: c.cliente}, null, 2);
}

function renderClientes(){
  var box = document.getElementById("viewClientes");
  var editando = UI.editandoId;
  var html = "";

  if (editando){
    var novo = editando === "__novo__";
    var clienteEdit = novo ? clienteVazio() : STATE.clientes[editando];

      + '<form id="formCliente">' + formularioCliente(clienteEdit) + '</form>'

        + '<button class="btn ghost" id="btnCancelarCliente">Cancelar</button>'
      + '</div></div>';
    box.innerHTML = html;
    if (!novo) preencherFormulario(clienteEdit); else {
      document.getElementById("fProdutos").value=""; document.getElementById("fPublico").value="";
      document.getElementById("fDiferenciais").value=""; document.getElementById("fObjetivos").value="";
      document.getElementById("fTom").value=""; document.getElementById("fVisual").value=""; document.getElementById("fInfo").value="";
    }
    if (!novo){
      document.getElementById("fProdutos").value = clienteEdit.cliente.produtos_servicos||"";
      document.getElementById("fPublico").value = clienteEdit.cliente.publico_alvo||"";
      document.getElementById("fDiferenciais").value = clienteEdit.cliente.diferenciais||"";
      document.getElementById("fObjetivos").value = clienteEdit.cliente.objetivos||"";
      document.getElementById("fTom").value = clienteEdit.cliente.tom_de_voz||"";
      document.getElementById("fVisual").value = clienteEdit.cliente.identidade_visual||"";
      document.getElementById("fInfo").value = clienteEdit.cliente.informacoes_importantes||"";

      var dados = lerFormulario(novo ? null : editando);

      var alvo = novo ? clienteVazio() : STATE.clientes[editando];

  var lista = listaClientes();

    return;

  html += '<div class="panel">'
    + '<h3>'+esc(c.cliente.nome)+' '+(local?'<span class="badge-local">não salvo no repositório</span>':'')+(c.cliente.demonstracao?'<span class="badge-demo">exemplo</span>':'')+'</h3>'
    + '<div class="row2">'
      + '<div><h4>Segmento</h4><p>'+esc(c.cliente.segmento||"—")+'</p></div>'
      + '<div><h4>Objetivos</h4><p>'+esc(c.cliente.objetivos||"—")+'</p></div>'
    + '</div>'
    + '<h4>Produtos e serviços</h4><p>'+esc(c.cliente.produtos_servicos||"—")+'</p>'
    + '<h4>Público-alvo</h4><p>'+esc(c.cliente.publico_alvo||"—")+'</p>'
    + '<h4>Diferenciais</h4><p>'+esc(c.cliente.diferenciais||"—")+'</p>'
    + '<h4>Tom de voz</h4><p>'+esc(c.cliente.tom_de_voz||"—")+'</p>'
    + '<h4>Identidade visual</h4><p>'+esc(c.cliente.identidade_visual||"—")+'</p>'
    + '<div class="row2">'
      + '<div><h4>Palavras a usar</h4><p>'+(c.cliente.palavras_usar||[]).map(function(w){return '<span class="tag">'+esc(w)+'</span>';}).join(" ")+'</p></div>'
      + '<div><h4>Palavras a evitar</h4><p>'+(c.cliente.palavras_evitar||[]).map(function(w){return '<span class="tag warn">'+esc(w)+'</span>';}).join(" ")+'</p></div>'
    + '</div>'
    + '<h4>Informações importantes</h4><p>'+esc(c.cliente.informacoes_importantes||"—")+'</p>'
    + '<div class="item-actions" style="border-top:0;padding-top:0">'
      + '<button class="btn" id="btnEditarCliente">✏️ Editar</button>'
      + '<button class="btn" id="btnCopiarJson">📋 Copiar JSON do cliente</button>'
      + '<button class="btn danger" id="btnExcluirCliente">🗑️ Excluir (local)</button>'
    + '</div>'
    + (local ? '<div class="hint" style="margin-top:12px">Este cliente só existe neste navegador. Copie o JSON e peça ao agente: <b>"cadastre este cliente"</b>, ou diga os dados no chat, para ele salvar em <code>clientes/adspot/conteudo/'+esc(c.cliente.id)+'/cliente.json</code>.</div>' : '')
    + '</div>';

  html += '<h3 style="margin:4px 0 10px">Todos os clientes</h3><div class="grid-clientes">'
    + lista.map(function(x){
        var l = !SEED_IDS[x.cliente.id];

          + '<div class="seg">'+esc(x.cliente.segmento||"—")+'</div>'
          + '</button>';
      }).join("") + '</div>';

  box.innerHTML = html;
  document.getElementById("btnEditarCliente").onclick = function(){ UI.editandoId = c.cliente.id; salvarUI(); renderTudo(); };
  document.getElementById("btnCopiarJson").onclick = function(){ copiar(jsonClienteParaAgente(c), "JSON do cliente copiado"); };
  document.getElementById("btnExcluirCliente").onclick = function(){

    delete STATE.clientes[c.cliente.id]; UI.clienteId=null; salvarEstado(); salvarUI(); renderTudo();

    comando('Crie um '+TIPOS[tipo]+' para o cliente '+c.cliente.nome+(pilar?' (pilar: '+PILARES[pilar]+')':'')+'. '
      + (ideia ? 'Ideia/tema: '+ideia+'.' : 'Sugira o tema, com base no perfil e no histórico do cliente.'));
  };

  function aplicarFiltros(){
    var q = filtroCriar.q.toLowerCase();
    return (c.conteudos||[]).filter(function(i){
      if (filtroCriar.tipo && i.tipo!==filtroCriar.tipo) return false;
      if (filtroCriar.pilar && i.pilar!==filtroCriar.pilar) return false;
      if (filtroCriar.status && i.status!==filtroCriar.status) return false;
      if (q){
        var hay = [i.titulo, i.reel&&i.reel.gancho, i.post&&i.post.cta, i.reel&&i.reel.cta].filter(Boolean).join(" ").toLowerCase();
        if (hay.indexOf(q) < 0) return false;
      }
      return true;
    }).sort(function(a,b){ return (b.data_criacao||"").localeCompare(a.data_criacao||""); });
  }
  function redesenharLista(){
    var alvo = document.getElementById("listaConteudos");
    var itens = aplicarFiltros();
    alvo.innerHTML = "";
    if (!itens.length){ alvo.innerHTML = '<div class="empty">Nenhum conteúdo com esses filtros ainda.</div>'; return; }
    itens.forEach(function(i){ alvo.appendChild(cardConteudo(i, c)); });
  }
  document.getElementById("fBusca").oninput = function(){ filtroCriar.q=this.value; redesenharLista(); };
  document.getElementById("fTipo").onchange = function(){ filtroCriar.tipo=this.value; redesenharLista(); };
  document.getElementById("fPilar").onchange = function(){ filtroCriar.pilar=this.value; redesenharLista(); };
  document.getElementById("fStatus").onchange = function(){ filtroCriar.status=this.value; redesenharLista(); };
  redesenharLista();
}

      + '<div class="sub">Pode escrever livre — o agente organiza por dia e equilibra os pilares (autoridade, educação, engajamento, branding, prova social, vendas, conversão).</div></div>'

      porDia[d].forEach(function(it){

          + '<p class="ideia">'+esc(it.ideia_resumo||"(sem ideia ainda)")+'</p>'
          + (it.cta_previsto ? '<p class="cta">CTA previsto: '+esc(it.cta_previsto)+'</p>' : '')

        +'e associe cada conteúdo desenvolvido ao item correspondente da semana '+s.id+'.');

/* ============================================================
   HISTÓRICO
   ============================================================ */
var filtroHist = {tipo:"", pilar:"", status:"", q:""};
function renderHistorico(){
  var box = document.getElementById("viewHistorico");
  var c = clienteAtual();
  if (!c){ box.innerHTML = '<div class="empty">Cadastre um cliente primeiro.</div>'; return; }

  var html = '<div class="panel"><h3>Histórico de '+esc(c.cliente.nome)+'</h3>'
    + '<div class="hint">Usado pelo agente antes de criar qualquer conteúdo novo, para não repetir gancho, tema ou CTA. Itens marcados aqui como repetidos merecem atenção.</div>'
    + '<div class="filters-row">'
      + '<input type="search" id="hBusca" placeholder="Buscar…" value="'+esc(filtroHist.q)+'">'
      + '<select id="hTipo"><option value="">Todos os formatos</option>'+Object.keys(TIPOS).map(function(t){return '<option value="'+t+'"'+(filtroHist.tipo===t?' selected':'')+'>'+TIPOS[t]+'</option>';}).join("")+'</select>'
      + '<select id="hStatus"><option value="">Todos os status</option>'+Object.keys(STATUS).map(function(s){return '<option value="'+s+'"'+(filtroHist.status===s?' selected':'')+'>'+STATUS[s]+'</option>';}).join("")+'</select>'
      + '<button class="btn small" id="btnCopiarHist">Copiar planilha</button>'
    + '</div><div id="linhasHist"></div></div>';
  box.innerHTML = html;

  function ctaOuGancho(i){ return (i.reel&&i.reel.gancho) || (i.post&&i.post.cta) || (i.reel&&i.reel.cta) || (i.carrossel&&i.carrossel.cta) || ""; }
  function contarRepeticoes(lista){
    var cont = {};
    lista.forEach(function(i){ var v = ctaOuGancho(i).trim().toLowerCase(); if (v) cont[v] = (cont[v]||0)+1; });
    return cont;
  }
  function itensFiltrados(){
    var q = filtroHist.q.toLowerCase();
    return (c.conteudos||[]).filter(function(i){
      if (filtroHist.tipo && i.tipo!==filtroHist.tipo) return false;
      if (filtroHist.status && i.status!==filtroHist.status) return false;
      if (q){
        var hay = [i.titulo, ctaOuGancho(i)].join(" ").toLowerCase();
        if (hay.indexOf(q) < 0) return false;
      }
      return true;
    }).sort(function(a,b){ return (b.data_criacao||"").localeCompare(a.data_criacao||""); });
  }
  function redesenhar(){
    var itens = itensFiltrados();
    var rep = contarRepeticoes(c.conteudos||[]);
    var alvo = document.getElementById("linhasHist");
    if (!itens.length){ alvo.innerHTML = '<div class="empty">Nenhum conteúdo com esses filtros.</div>'; return; }
    alvo.innerHTML = itens.map(function(i){
      var g = ctaOuGancho(i).trim().toLowerCase();
      var repetido = g && rep[g] > 1;
      return '<div class="hist-linha">'
        + '<div class="data">'+dataBr(i.data_criacao)+'</div>'
        + '<div>'+tagTipo(i.tipo)+'</div>'
        + '<div class="tit">'+esc(i.titulo||"—")+(ctaOuGancho(i)?' <span style="color:var(--ink-3);font-weight:400">— '+esc(ctaOuGancho(i))+'</span>':'')
          + (repetido ? ' <span class="tag warn">repetido '+rep[g]+'x</span>' : '') + '</div>'
        + '<div>'+tagStatus(i.status)+'</div>'
      + '</div>';
    }).join("");
  }
  document.getElementById("hBusca").oninput = function(){ filtroHist.q=this.value; redesenhar(); };
  document.getElementById("hTipo").onchange = function(){ filtroHist.tipo=this.value; redesenhar(); };
  document.getElementById("hStatus").onchange = function(){ filtroHist.status=this.value; redesenhar(); };
  document.getElementById("btnCopiarHist").onclick = function(){
    var cols = ["Data","Formato","Pilar","Título","Gancho/CTA","Status"];
    var linhas = itensFiltrados().map(function(i){ return [dataBr(i.data_criacao), TIPOS[i.tipo]||i.tipo, PILARES[i.pilar]||i.pilar||"", i.titulo||"", ctaOuGancho(i), STATUS[i.status]||i.status]; });
    var tsv = [cols].concat(linhas).map(function(r){ return r.map(function(v){ return String(v==null?"":v).replace(/[\t\n]+/g," "); }).join("\t"); }).join("\n");
    copiar(tsv, "Histórico copiado: cole no Sheets ou Excel");
  };
  redesenhar();
}

/* ---------- render geral ---------- */
function renderTudo(){
  renderSelectCliente();
  mostrarAba(UI.aba || "dashboard");
  renderDashboard();
  renderClientes();
  renderCriar();
  renderSemana();
  renderMensal();
  renderIdeias();
  renderHistorico();
}
UI.aba = UI.aba || "dashboard";
renderTudo();

})();
</script>
