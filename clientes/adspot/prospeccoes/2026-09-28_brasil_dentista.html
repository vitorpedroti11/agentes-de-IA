<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dentistas pelo Brasil</title>
<meta name="theme-color" content="#16151a">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f5f3ef; --surface:#ffffff; --surface-2:#f0ede7; --line:#e2ddd3; --ink:#16151a; --ink-2:#55525c; --ink-3:#8c8894;
  --accent:#ff5a1f; --accent-ink:#ffffff; --accent-soft:#ffe6db;
  --a:#16a34a; --a-soft:#dcf5e3; --b:#d97706; --b-soft:#fdf0d5; --c:#6b7280; --c-soft:#eceef1;
  --bad:#dc2626; --bad-soft:#fde4e4; --ok:#16a34a;
  --shadow:0 1px 2px rgba(20,18,30,.05),0 6px 24px -12px rgba(20,18,30,.18);
  --radius:14px; --mono:"JetBrains Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0f0f13; --surface:#18181e; --surface-2:#202028; --line:#2c2c36; --ink:#f2f0ec; --ink-2:#b4b1bb; --ink-3:#7c7985;
    --accent:#ff6a33; --accent-soft:#3a1d12; --a-soft:#10301b; --b-soft:#35270c; --c-soft:#26272d; --bad-soft:#3a1515;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 28px -14px rgba(0,0,0,.7);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0f0f13; --surface:#18181e; --surface-2:#202028; --line:#2c2c36; --ink:#f2f0ec; --ink-2:#b4b1bb; --ink-3:#7c7985;
  --accent:#ff6a33; --accent-soft:#3a1d12; --a-soft:#10301b; --b-soft:#35270c; --c-soft:#26272d; --bad-soft:#3a1515;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 28px -14px rgba(0,0,0,.7);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.5 "Inter Tight",system-ui,-apple-system,Segoe UI,sans-serif;-webkit-font-smoothing:antialiased}
a{color:inherit}
button,select,input,textarea{font:inherit;color:inherit}
.wrap{max-width:1180px;margin:0 auto;padding:0 16px}

/* Topo */
header.top{padding:28px 0 18px;border-bottom:1px solid var(--line);margin-bottom:22px}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;letter-spacing:-.01em}
.brand .dot{width:26px;height:26px;border-radius:8px;background:var(--accent);display:grid;place-items:center;color:var(--accent-ink);font-weight:800;font-size:14px}
.top-row{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap}
h1{font-size:clamp(26px,4vw,38px);line-height:1.1;letter-spacing:-.03em;margin:14px 0 6px;font-weight:800}
.sub{color:var(--ink-2);margin:0}
.top-actions{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 12px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;font-size:14px;font-weight:500;text-decoration:none;white-space:nowrap}
.btn:hover{border-color:var(--ink-3)}
.btn:focus-visible,.chip:focus-visible,.tab:focus-visible,.qa:focus-visible,.lead-head:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.small{padding:5px 9px;font-size:13px}
.demo-banner{background:var(--b-soft);border:1px solid var(--b);color:var(--ink);border-radius:12px;padding:10px 14px;margin:0 0 18px;font-size:14px}

/* KPIs */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:18px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;box-shadow:var(--shadow)}
.kpi .v{font-size:28px;font-weight:800;letter-spacing:-.02em;line-height:1.1;font-variant-numeric:tabular-nums}
.kpi .l{color:var(--ink-2);font-size:13px}
.kpi.accent .v{color:var(--accent)}

.pipeline{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:18px}
.pipe{background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px 12px;font-size:13px;color:var(--ink-2)}
.pipe b{color:var(--ink);font-variant-numeric:tabular-nums}

/* Filtros */
.filters{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);padding:12px 0;margin-bottom:10px;border-bottom:1px solid var(--line)}
.filters-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.search{flex:1 1 220px;min-width:0;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 12px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 11px;font-size:13px;cursor:pointer;user-select:none}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
select.sel{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:7px 10px;font-size:14px;max-width:100%}
.count{color:var(--ink-3);font-size:13px;margin:6px 0 12px}

/* Leads */
.lead{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);margin-bottom:10px;box-shadow:var(--shadow);overflow:hidden}
.lead-head{display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center;padding:14px 16px;cursor:pointer}
.lead-head:hover{background:var(--surface-2)}
.score{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;position:relative;flex:none}
.score svg{position:absolute;inset:0;transform:rotate(-90deg)}
.score span{font-weight:800;font-size:16px;font-variant-numeric:tabular-nums}
.lead-title{min-width:0}
.lead-title h3{margin:0;font-size:17px;letter-spacing:-.01em;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.owner{color:var(--ink-2);font-size:14px;margin-top:2px}
.owner strong{color:var(--ink)}
.meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.tag{font-size:12px;padding:2px 8px;border-radius:999px;background:var(--surface-2);color:var(--ink-2);border:1px solid var(--line);white-space:nowrap}
.tag.prio-A{background:var(--a-soft);color:var(--a);border-color:transparent;font-weight:700}
.tag.prio-B{background:var(--b-soft);color:var(--b);border-color:transparent;font-weight:700}
.tag.prio-C{background:var(--c-soft);color:var(--c);border-color:transparent;font-weight:700}
.tag.prod{background:var(--accent-soft);color:var(--accent);border-color:transparent;font-weight:600}
.tag.ok{color:var(--ok)}
.tag.warn{color:var(--bad)}
.head-right{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.status-sel{font-size:13px;padding:5px 8px;border-radius:8px;border:1px solid var(--line);background:var(--surface)}
.chev{transition:transform .2s;color:var(--ink-3)}
.lead[open] .chev{transform:rotate(180deg)}

.ig-row{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px;font-size:13px}
.ig{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:999px;text-decoration:none;font-weight:600;border:1px solid transparent;background:linear-gradient(var(--surface),var(--surface)) padding-box,linear-gradient(45deg,#f58529,#dd2a7b,#8134af) border-box}
.ig:hover{filter:brightness(.97)}
.ig small{font-weight:500;color:var(--ink-3)}
.ig.none{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.lead-body{display:none;border-top:1px solid var(--line);padding:16px;gap:16px;grid-template-columns:repeat(3,minmax(0,1fr))}
.lead[open] .lead-body{display:grid}
.panel{background:var(--surface-2);border-radius:12px;padding:14px;min-width:0}
.panel h4{margin:0 0 10px;font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-3);font-weight:700}
dl.kv{margin:0;display:grid;grid-template-columns:auto 1fr;gap:5px 12px;font-size:14px}
dl.kv dt{color:var(--ink-3)}
dl.kv dd{margin:0;min-width:0;overflow-wrap:anywhere}
.mono{font-family:var(--mono);font-size:13px}
.socios{margin:10px 0 0;padding:0;list-style:none;font-size:13px}
.socios li{padding:6px 0;border-top:1px dashed var(--line)}
.socios li b{display:block;color:var(--ink)}
.socios li span{color:var(--ink-3)}
.check{display:flex;gap:8px;align-items:flex-start;font-size:14px;padding:6px 0;border-top:1px dashed var(--line)}
.check:first-of-type{border-top:0}
.check .ic{flex:none;width:20px;height:20px;border-radius:6px;display:grid;place-items:center;font-size:12px;font-weight:800}
.ic.bad{background:var(--bad-soft);color:var(--bad)}
.ic.mid{background:var(--b-soft);color:var(--b)}
.ic.good{background:var(--a-soft);color:var(--a)}
.check small{display:block;color:var(--ink-3)}
ul.dores{margin:10px 0 0;padding-left:18px;font-size:14px}
ul.dores li{margin:3px 0}
.why{font-size:14px;color:var(--ink-2);margin:6px 0 0}
.tabs{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:8px}
.tab{border:0;background:transparent;border-radius:8px;padding:5px 9px;font-size:13px;cursor:pointer;color:var(--ink-2)}
.tab[aria-selected="true"]{background:var(--surface);color:var(--ink);font-weight:600;box-shadow:var(--shadow)}
.msg{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;font-size:14px;white-space:pre-wrap;min-height:90px}
.msg-actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.links{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
textarea.notes{width:100%;margin-top:12px;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 10px;font-size:14px;min-height:60px;resize:vertical}
.fontes{grid-column:1/-1;font-size:12px;color:var(--ink-3);overflow-wrap:anywhere}
.fontes a{color:var(--ink-3)}
.unverified{color:var(--bad);font-weight:600}

section.block{margin:28px 0}
section.block h2{font-size:18px;letter-spacing:-.01em;margin:0 0 10px}
.desc-list{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:4px 16px}
.desc-list div{padding:10px 0;border-top:1px solid var(--line);font-size:14px}
.desc-list div:first-child{border-top:0}
.desc-list span{color:var(--ink-3)}
.next{background:var(--ink);color:var(--bg);border-radius:var(--radius);padding:18px 20px;margin:28px 0 40px}
.next b{color:var(--accent)}
.empty{padding:40px;text-align:center;color:var(--ink-3)}
.toast{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);opacity:0;background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:10px;font-size:14px;transition:.2s;pointer-events:none;z-index:20}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* Ações rápidas: sempre visíveis, sem abrir o lead */
.quick{display:flex;gap:8px;flex-wrap:wrap;padding:0 16px 14px}
.qa{flex:1 1 0;min-width:0;min-height:44px;display:inline-flex;align-items:center;justify-content:center;gap:6px;border-radius:12px;border:1px solid var(--line);background:var(--surface-2);color:var(--ink);font-weight:600;font-size:14px;text-decoration:none;cursor:pointer;white-space:nowrap;padding:0 10px}
.qa.wa{background:#1f9d55;border-color:#1f9d55;color:#fff}
.qa.dm{background:linear-gradient(45deg,#f58529,#dd2a7b,#8134af);border-color:transparent;color:#fff}
.qa svg{width:18px;height:18px;flex:none}
.btn-filtros{display:none}
.phone{font-variant-numeric:tabular-nums;user-select:all}

@media (max-width:900px){.lead-body{grid-template-columns:1fr}}
@media (max-width:560px){
  header.top{padding:18px 0 14px;margin-bottom:14px}
  h1{font-size:22px;letter-spacing:-.02em;margin:10px 0 4px}
  .sub{font-size:13px}
  .top-actions{width:100%}
  .top-actions .btn{flex:1 1 0;justify-content:center;min-height:40px;padding:8px}
  .kpis{grid-template-columns:repeat(2,1fr);gap:8px}
  .kpi{padding:10px 12px}
  .kpi .v{font-size:22px}
  .kpi:last-child:nth-child(odd){grid-column:1/-1}
  .filters{padding:10px 0}
  .search,select.sel,textarea.notes,.status-sel{font-size:16px}
  .search{min-height:44px}
  .btn-filtros{display:inline-flex;min-height:44px}
  #filtrosExtra{display:none;margin-top:8px}
  .filters.aberto #filtrosExtra{display:block}
  #filtrosExtra .filters-row{margin-top:8px}
  select.sel{flex:1 1 45%;min-height:44px}
  .chip{padding:8px 12px;font-size:14px}
  .lead-head{grid-template-columns:auto 1fr;padding:12px;gap:12px}
  .head-right{grid-column:1/-1;flex-direction:row;justify-content:space-between;align-items:center}
  .status-sel{flex:1;min-height:40px;margin-right:10px}
  .score{width:44px;height:44px}
  .quick{padding:0 12px 12px}
  .lead-body{padding:12px;gap:12px}
  .lead-body .panel:nth-child(3){order:-1}
  .panel{padding:12px}
  .tabs{flex-wrap:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}
  .tab{flex:none;padding:8px 12px;font-size:14px}
  .msg{font-size:15px}
  .msg-actions .btn,.links .btn{min-height:40px}
  dl.kv{grid-template-columns:1fr;gap:0}
  dl.kv dt{margin-top:8px;font-size:12px}
  .next{margin-bottom:24px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="top-row">
      <div class="brand"><div class="dot">A</div>Adspot · Prospecção</div>
      <div class="top-actions">
        <button class="btn" id="toggleAll">Expandir todos</button>
        <button class="btn" id="copiarPlanilha">Copiar planilha</button>
        <button class="btn" id="theme" aria-label="Alternar tema">◐ Tema</button>
      </div>
    </div>
    <h1 id="titulo">Prospecção</h1>
    <p class="sub" id="subtitulo"></p>
  </header>

  <div id="demo"></div>
  <div class="kpis" id="kpis"></div>
  <div class="pipeline" id="pipeline"></div>

  <div class="filters">
    <div class="filters-row">
      <input class="search" id="q" type="search" placeholder="Buscar empresa, dono, bairro, CNPJ…" aria-label="Buscar">
      <button class="btn btn-filtros" id="btnFiltros" aria-expanded="false" aria-controls="filtrosExtra">Filtros</button>
    </div>
    <div id="filtrosExtra">
    <div class="filters-row">
      <select class="sel" id="fProduto"><option value="">Todos os produtos</option></select>
      <select class="sel" id="fStatus"><option value="">Todos os status</option></select>
      <select class="sel" id="ordem">
        <option value="score">Maior pontuação</option>
        <option value="nome">Nome (A–Z)</option>
        <option value="nicho">Nicho</option>
      </select>
    </div>
    <div class="filters-row" style="margin-top:8px">
      <div class="chips" id="chipsPrio"></div>
      <div class="chips" id="chipsNicho"></div>
    </div>
    </div>
  </div>

  <div class="count" id="count"></div>
  <div id="lista"></div>

  <section class="block" id="descartadosWrap" hidden>
    <h2>Descartados e por quê</h2>
    <div class="desc-list" id="descartados"></div>
  </section>

  <div class="next" id="proximo"></div>
</div>
<div class="toast" id="toast"></div>

<script>

  function nicho(n){ return NICHOS[n] || n || "—"; }
  function toast(t){ var el = document.getElementById("toast"); el.textContent = t; el.classList.add("show"); clearTimeout(toast._t); toast._t = setTimeout(function(){ el.classList.remove("show"); }, 1600); }

  };

  /* Cabeçalho */
  var nichosTxt = (P.nichos||[]).map(nicho).join(" · ");
  document.getElementById("titulo").textContent = "Prospecção — " + (P.cidade || "sem cidade") + (P.regiao ? " · " + P.regiao : "");

  }

      '<div class="lead-head" tabindex="0" role="button" aria-expanded="false">'
        + ring(l.score, l.prioridade)
        + '<div class="lead-title"><h3>'+esc(l.nome_fantasia || c.razao_social)+'</h3>'
          + '<div class="owner">'+dono+'</div>' + igRow
          + '<div class="meta"><span class="tag prio-'+esc(l.prioridade)+'">'+esc(l.prioridade)+'</span><span class="tag">'+esc(nicho(l.nicho))+'</span>'
          + (l.bairro ? '<span class="tag">'+esc(l.bairro)+'</span>' : '')
          + (pr.recomendado ? '<span class="tag prod">'+esc(pr.recomendado)+(pr.valor?' · '+esc(pr.valor):'')+'</span>' : '')
          + '</div></div>'
        + '<div class="head-right"><select class="status-sel" aria-label="Status">'+STATUS.map(function(x){return '<option'+(x===s.status?' selected':'')+'>'+esc(x)+'</option>';}).join("")+'</select><span class="chev">▾</span></div>'
      + '</div>'
      + quick
      + '<div class="lead-body">'
        + '<div class="panel"><h4>Empresa · CNPJ</h4><dl class="kv">'
          + '<dt>CNPJ</dt><dd class="mono">'+esc(c.numero||"—")+'</dd>'
          + '<dt>Razão social</dt><dd>'+esc(c.razao_social||"—")+'</dd>'
          + '<dt>Situação</dt><dd>'+esc(c.situacao||"—")+'</dd>'
          + '<dt>Abertura</dt><dd>'+esc(dataBr(c.abertura))+(c.abertura?' <span style="color:var(--ink-3)">('+esc(idade(c.abertura))+')</span>':'')+'</dd>'
          + '<dt>Porte</dt><dd>'+esc(c.porte||"—")+'</dd>'
          + '<dt>Capital</dt><dd>'+esc(brl(c.capital_social))+'</dd>'
          + '<dt>CNAE</dt><dd>'+esc(c.cnae||"—")+'</dd>'
          + '<dt>Endereço</dt><dd>'+esc(c.endereco||"—")+'</dd>'
          + '<dt>Contato</dt><dd>'+([ct.whatsapp ? '<span class="phone">'+esc(ct.whatsapp)+'</span>' : '', esc(ct.instagram), esc(ct.email)].filter(Boolean).join(" · ") || "—")+'</dd>'
          + (ct.melhor_horario ? '<dt>Horário</dt><dd>'+esc(ct.melhor_horario)+'</dd>' : '')
        + '</dl>'
        + (socios ? '<h4 style="margin-top:14px">Quadro de sócios</h4><ul class="socios">'+socios+'</ul>' : '')
        + '</div>'
        + '<div class="panel"><h4>Presença digital · a dor</h4>'+presenca(l)
          + ((l.dores||[]).length ? '<ul class="dores">'+l.dores.map(function(x){return '<li>'+esc(x)+'</li>';}).join("")+'</ul>' : '')
          + (pr.justificativa ? '<h4 style="margin-top:14px">Por que '+esc(pr.recomendado||"esta oferta")+'</h4><p class="why">'+esc(pr.justificativa)+'</p>' : '')
          + (l.score_detalhe ? '<p class="why" style="font-size:13px">Dor '+esc(l.score_detalhe.dor)+'/40 · Capacidade '+esc(l.score_detalhe.capacidade)+'/30 · Acesso '+esc(l.score_detalhe.acesso)+'/15 · Timing '+esc(l.score_detalhe.timing)+'/15</p>' : '')
        + '</div>'
        + '<div class="panel"><h4>Abordagem</h4>'+mensagens(l)
          + (l.gancho ? '<p class="why"><b>Gancho:</b> '+esc(l.gancho)+'</p>' : '')
          + '<div class="links">'+links+'</div>'
          + '<textarea class="notes" placeholder="Anotações (salvas neste navegador)">'+esc(s.notas)+'</textarea>'
        + '</div>'
        + ((l.fontes||[]).length ? '<div class="fontes">Fontes: '+l.fontes.map(function(f){ var u=url(f); return u ? '<a href="'+esc(u)+'" target="_blank" rel="noopener">'+esc(u)+'</a>' : esc(f); }).join(" · ")+'</div>' : '')
      + '</div>';

    var head = el.querySelector(".lead-head");
    function toggle(){ var o = el.hasAttribute("open"); if (o) el.removeAttribute("open"); else el.setAttribute("open",""); head.setAttribute("aria-expanded", String(!o)); }
    head.addEventListener("click", function(e){ if (e.target.closest("select")) return; toggle(); });
    head.addEventListener("keydown", function(e){ if ((e.key==="Enter"||e.key===" ") && !e.target.closest("select")){ e.preventDefault(); toggle(); } });
    el.querySelector(".status-sel").onchange = function(e){ st(l.id).status = e.target.value; save(state); kpis(); };
    el.querySelector(".notes").oninput = function(e){ st(l.id).notas = e.target.value; save(state); };

    var atual = Object.keys(l.mensagens||{})[0];
    var tabs = el.querySelectorAll(".tab"), box = el.querySelector("[data-msg]"), wa = el.querySelector("[data-wa]");
    if (tabs.length) atual = tabs[0].dataset.k;
    function setWa(){ if (wa) wa.href = "https://wa.me/"+waNum(l)+"?text="+encodeURIComponent((l.mensagens||{})[atual]||""); }
    tabs.forEach(function(t){ t.onclick = function(){ tabs.forEach(function(x){x.setAttribute("aria-selected","false");}); t.setAttribute("aria-selected","true"); atual = t.dataset.k; box.textContent = l.mensagens[atual]; setWa(); }; });
    setWa();
    var cp = el.querySelector("[data-copy]"); if (cp) cp.onclick = function(){ copy((l.mensagens||{})[atual]||""); };
    function marcarEnviado(){ var s2 = st(l.id); if (s2.status === STATUS[0]) { s2.status = STATUS[1]; save(state); el.querySelector(".status-sel").value = STATUS[1]; kpis(); } }
    var qwa = el.querySelector("[data-qwa]"); if (qwa) qwa.addEventListener("click", marcarEnviado);
    var qdm = el.querySelector("[data-qdm]"); if (qdm) qdm.addEventListener("click", function(){
      var txt = (l.mensagens||{}).instagram_dm || (l.mensagens||{}).whatsapp || "";
      if (txt) copy(txt, "Mensagem copiada: cole no Direct");
      marcarEnviado();
    });
    if (wa) wa.addEventListener("click", function(){ var s2 = st(l.id); if (s2.status === STATUS[0]) { s2.status = STATUS[1]; save(state); el.querySelector(".status-sel").value = STATUS[1]; kpis(); } });
    return el;
  }

  var lista = document.getElementById("lista");
  var cards = {};
  LEADS.forEach(function(l, i){ if (!l.id) l.id = "lead-"+i; cards[l.id] = card(l); });

  function render(){
    var arr = LEADS.filter(passa).slice();
    arr.sort(function(a,b){
      if (F.ordem === "nome") return String(a.nome_fantasia).localeCompare(String(b.nome_fantasia),"pt-BR");
      if (F.ordem === "nicho") return String(a.nicho).localeCompare(String(b.nicho)) || (b.score - a.score);
      return (b.score||0) - (a.score||0);
    });
    lista.innerHTML = "";
    arr.forEach(function(l){ lista.appendChild(cards[l.id]); });
    if (!arr.length) lista.innerHTML = '<div class="empty">Nenhum lead com esses filtros.</div>';
    document.getElementById("count").textContent = arr.length + " de " + LEADS.length + " leads";
  }

  document.getElementById("toggleAll").onclick = function(){
    var abrir = this.textContent.indexOf("Expandir") === 0;
    Object.keys(cards).forEach(function(k){ if (abrir) cards[k].setAttribute("open",""); else cards[k].removeAttribute("open"); });
    this.textContent = abrir ? "Recolher todos" : "Expandir todos";
  };

  function igHandleCsv(u){ var m = String(u||"").match(/instagram\.com\/([^\/?#]+)/i); return m ? "@"+m[1] : String(u||""); }
  document.getElementById("copiarPlanilha").onclick = function(){
    var cols = ["Prioridade","Score","Empresa","Nicho","Bairro","Dono","Qualificação","Dono validado","CNPJ","Porte","Abertura","Produto","WhatsApp","Instagram da empresa","Instagram do dono","Status","Notas"];
    var rows = LEADS.map(function(l){ var c=l.cnpj||{}, d=l.decisor||{}, ct=l.contato||{}, s=st(l.id);
      return [l.prioridade,l.score,l.nome_fantasia,nicho(l.nicho),l.bairro,d.nome,d.qualificacao,d.validado?"sim":"não",c.numero,c.porte,dataBr(c.abertura),(l.produto||{}).recomendado,ct.whatsapp,igHandleCsv(((l.presenca||{}).instagram||{}).url)||ct.instagram||"não encontrado",igHandleCsv(d.instagram),s.status,s.notas]; });
    var tsv = [cols].concat(rows).map(function(r){ return r.map(function(v){ return String(v==null?"":v).replace(/[\t\n]+/g," "); }).join("\t"); }).join("\n");
    copy(tsv, "Planilha copiada: cole no Google Sheets ou Excel");
  };

  var desc = D.descartados || [];
  if (desc.length){
    document.getElementById("descartadosWrap").hidden = false;
    document.getElementById("descartados").innerHTML = desc.map(function(x){ return '<div><b>'+esc(x.nome)+'</b> <span>· '+esc(nicho(x.nicho))+'</span><br><span>'+esc(x.motivo)+'</span></div>'; }).join("");
  }
  var prox = document.getElementById("proximo");
  if (D.proximo_passo) prox.innerHTML = '<b>Próximo passo →</b> ' + esc(D.proximo_passo); else prox.remove();

  kpis(); render();
})();
</script>
</body>
</html>
